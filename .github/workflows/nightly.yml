name: Nightly

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions: { }

jobs:
  checks:
    name: Nightly ${{ matrix.branch }}
    strategy:
      fail-fast: false
      matrix:
        # Reproducibility is supported on main, 9.1, and 9.0.
        include:
          - { branch: 'main', build-jdk: '25', docs: true, strict-jaxp: true, jaxp-jdk: '25', reproducibility: true }
          - { branch: '9.1', build-jdk: '25', docs: true, strict-jaxp: true, jaxp-jdk: '25', reproducibility: true }
          - { branch: '9.0', build-jdk: '21', docs: true, strict-jaxp: true, jaxp-jdk: '23', reproducibility: true }
          - { branch: '8.0', build-jdk: '17', docs: true, strict-jaxp: false, jaxp-jdk: '25', reproducibility: false }
          - { branch: '7.0', build-jdk: '17', docs: true, strict-jaxp: false, jaxp-jdk: '25', reproducibility: false }
          - { branch: '6.2', build-jdk: '17', docs: true, strict-jaxp: false, jaxp-jdk: '25', reproducibility: false }
    uses: ./.github/workflows/nightly-checks.yml
    with:
      branch: ${{ matrix.branch }}
      build-jdk: ${{ matrix.build-jdk }}
      docs: ${{ matrix.docs }}
      strict-jaxp: ${{ matrix.strict-jaxp }}
      jaxp-jdk: ${{ matrix.jaxp-jdk }}
      reproducibility: ${{ matrix.reproducibility }}
    permissions:
      contents: read
