name: CI Reporting

on:
  workflow_run:
    workflows: [ "CI", "GH Actions CI", "Nightly" ]
    types: [ completed ]

permissions: { }

jobs:
  report:
    uses: hibernate/.github/.github/workflows/ci-reporting.yml@main
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    secrets: inherit
